name: Windows regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WinForms application
        run: dotnet build WinFormsApp1/WinFormsApp1.csproj --configuration Release
      - name: Run SQLite and WinForms regression checks
        run: dotnet run --project tests/LabCare.RegressionTests/LabCare.RegressionTests.csproj --configuration Release
      - name: Publish standalone Windows application
        run: |
          dotnet publish WinFormsApp1/WinFormsApp1.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/LabCare-Pro
          Copy-Item README.md, HUONG_DAN_NOP_BAI.md artifacts/LabCare-Pro/
      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: LabCare-Pro-win-x64
          path: artifacts/LabCare-Pro/
          if-no-files-found: error
          retention-days: 14
