name: Windows regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WinForms application
        run: dotnet build WinFormsApp1/WinFormsApp1.csproj --configuration Release
      - name: Run SQLite and WinForms regression checks
        run: dotnet run --project tests/LabCare.RegressionTests/LabCare.RegressionTests.csproj --configuration Release
